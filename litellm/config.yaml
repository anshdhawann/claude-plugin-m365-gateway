model_list:
  # ─────────────────────────────────────────────────────────
  # Map model IDs the Office add-in requests → your backend.
  #
  # The add-in discovers models via GET /v1/models then
  # sends Anthropic-format requests to POST /v1/messages.
  # LiteLLM translates them to the target provider format.
  #
  # Required model IDs (the add-in looks for these):
  #   claude-opus-4-7-20250820    — best for complex work
  #   claude-opus-4-6-20250820    — strong all-purpose
  #   claude-sonnet-4-6-20250820  — lightweight, fast
  #
  # See: https://support.claude.com/en/articles/13945233
  # ─────────────────────────────────────────────────────────

  # ── Opus 4.7 → your most capable model ──
  - model_name: claude-opus-4-7-20250820
    litellm_params:
      model: openai/YOUR_BEST_MODEL_ID      # e.g. deepseek-v4-flash, gpt-4o, claude-sonnet-4-5
      api_base: ${OPENER_BASE_URL}
      api_key: ${OPENER_API_KEY}
      rpm: 30                               # rate limit (requests per minute)

  # ── Opus 4.6 → your second-best model ──
  - model_name: claude-opus-4-6-20250820
    litellm_params:
      model: openai/YOUR_SECOND_MODEL_ID    # e.g. kimi-k2.6, gpt-4o-mini
      api_base: ${OPENER_BASE_URL}
      api_key: ${OPENER_API_KEY}
      rpm: 60

  # ── Sonnet 4.6 → your fastest/cheapest model ──
  - model_name: claude-sonnet-4-6-20250820
    litellm_params:
      model: openai/YOUR_FAST_MODEL_ID      # e.g. claude-haiku-3-5, llama-3-8b
      api_base: ${OPENER_BASE_URL}
      api_key: ${OPENER_API_KEY}
      rpm: 120

  # ── Example: native Anthropic passthrough (uncomment to use) ──
  # - model_name: claude-haiku-4-7-20250820
  #   litellm_params:
  #     model: anthropic/claude-haiku-4-7-20250820
  #     api_key: ${ANTHROPIC_API_KEY}

litellm_settings:
  drop_params: true          # silently ignore unsupported params
  set_verbose: true          # log all requests/responses for debugging

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
