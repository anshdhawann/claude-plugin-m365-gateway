services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable   # pin a specific release tag once it works
    restart: unless-stopped
    # No public port: only Caddy (same Docker network) reaches LiteLLM.
    # For local debugging use 127.0.0.1:4000:4000, never 4000:4000.
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux hosts; harmless on macOS
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - litellm

volumes:
  caddy_data:
  caddy_config:
